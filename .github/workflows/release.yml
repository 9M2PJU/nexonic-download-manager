name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ffmpeg-cache/mac
          key: ffmpeg-mac-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Build (Apple silicon and Intel)
        run: bash scripts/build-app.sh
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        # Files keep the same names in every release, so the README's direct download links always fetch the latest.
        run: |
          V="$(cat VERSION)"
          mkdir up
          cp "build/NexonicDownloadManager-$V.dmg" up/NexonicDownloadManager-Mac.dmg
          cp "build/NexonicExtension-$V.zip" up/NexonicExtension-Chrome.zip
          cp "build/NexonicFirefoxAddon-$V.xpi" up/NexonicAddon-Firefox.xpi
          gh release create "$GITHUB_REF_NAME" --draft --title "Nexonic Download Manager $V" --notes-file CHANGELOG.md up/*
  ffmpeg-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: .ffmpeg-cache/windows
          key: ffmpeg-windows-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y -qq mingw-w64 && bash scripts/build-ffmpeg.sh windows .ffmpeg-cache/windows
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          path: .ffmpeg-cache/windows
      - name: Video engine for Windows
        run: bash scripts/fetch-video-tools.sh windows .tools-cache/windows
      - uses: actions/upload-artifact@v4
        with:
          name: tools-windows
          path: .tools-cache/windows
  windows:
    needs: [release, ffmpeg-windows]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-windows
          path: .ffmpeg-cache/windows
      - uses: actions/download-artifact@v4
        with:
          name: tools-windows
          path: .tools-cache/windows
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: ./windows/build.ps1
        shell: pwsh
      - name: Add the Windows files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          Copy-Item "build\NexonicDownloadManager-Setup-$v.exe" build\NexonicDownloadManager-Windows-Setup.exe
          Copy-Item "build\NexonicDownloadManager-$v-windows-portable.zip" build\NexonicDownloadManager-Windows-Portable.zip
          gh release upload $env:GITHUB_REF_NAME build\NexonicDownloadManager-Windows-Setup.exe build\NexonicDownloadManager-Windows-Portable.zip
      - name: Publish the release (all Mac and Windows files are attached now)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release edit $env:GITHUB_REF_NAME --draft=false --latest
