name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ffmpeg-cache/mac
          key: ffmpeg-mac-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Tests
        run: swift test
      - name: Build the app
        run: UNIVERSAL=0 bash scripts/build-app.sh
      - name: Check the bundle
        run: |
          test -x "build/Nexonic Download Manager.app/Contents/MacOS/NexonicDownloadManager"
          test -x "build/Nexonic Download Manager.app/Contents/MacOS/nexonic-host"
          test -f "build/Nexonic Download Manager.app/Contents/Resources/AppIcon.icns"
          test -f "build/Nexonic Download Manager.app/Contents/Resources/Extension/manifest.json"
          test -f "build/Nexonic Download Manager.app/Contents/Resources/Firefox Add-on.xpi"
          "build/Nexonic Download Manager.app/Contents/MacOS/nexonic-host" help | grep -q "ndm batch"
          "build/Nexonic Download Manager.app/Contents/MacOS/ffmpeg" -hide_banner -muxers | grep -q " mp4 "
          lipo -archs "build/Nexonic Download Manager.app/Contents/MacOS/ffmpeg"
          plutil -lint "build/Nexonic Download Manager.app/Contents/Info.plist"
          python3 scripts/host-ping.py "build/Nexonic Download Manager.app/Contents/MacOS/nexonic-host"
      - uses: actions/upload-artifact@v4
        with:
          name: nexonic-download-manager
          path: build/*.dmg
  ffmpeg-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: .ffmpeg-cache/windows
          key: ffmpeg-windows-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y -qq mingw-w64 && bash scripts/build-ffmpeg.sh windows .ffmpeg-cache/windows
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          path: .ffmpeg-cache/windows
  windows:
    needs: ffmpeg-windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-windows
          path: .ffmpeg-cache/windows
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Tests
        run: dotnet test windows/Tests/Tests.csproj
      - name: Build the app and installer
        run: ./windows/build.ps1
        shell: pwsh
      - name: Bundled ffmpeg runs
        shell: pwsh
        run: |
          if (-not (Test-Path build\win\ffmpeg.exe)) { throw "ffmpeg.exe missing from the app folder" }
          $m = & build\win\ffmpeg.exe -hide_banner -muxers 2>&1 | Out-String
          if ($m -notmatch " mp4 ") { throw "ffmpeg has no mp4 muxer: $m" }
      - name: Helper answers a ping
        shell: pwsh
        run: |
          $body = [Text.Encoding]::UTF8.GetBytes('{"type":"ping"}')
          $p = New-Object Diagnostics.Process
          $p.StartInfo.FileName = "build\win\nexonic-host.exe"
          $p.StartInfo.RedirectStandardInput = $true
          $p.StartInfo.RedirectStandardOutput = $true
          $p.StartInfo.UseShellExecute = $false
          $p.Start() | Out-Null
          $s = $p.StandardInput.BaseStream
          $s.Write([BitConverter]::GetBytes($body.Length), 0, 4); $s.Write($body, 0, $body.Length); $s.Close()
          $out = $p.StandardOutput.ReadToEnd(); $p.WaitForExit()
          if ($out -notmatch '"ok":true') { throw "no ping answer: $out" }
      - uses: actions/upload-artifact@v4
        with:
          name: nexonic-download-manager-windows
          path: build/*.exe
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
        working-directory: extension
      - name: Manifest is valid JSON with the fixed key
        run: python3 -c "import json; m=json.load(open('extension/manifest.json')); assert m['manifest_version']==3 and m['key']"
      - name: Build the Chrome extension and the Firefox add-on
        run: |
          python3 scripts/build-extensions.py
          node --check build/extension-firefox/background.js
          node --check extension/content.js
      - name: Firefox add-on passes the linter
        run: npx --yes web-ext@8 lint --source-dir build/extension-firefox --warnings-as-errors=false
      - name: No outside names
        run: "! grep -rniE 'claude|anthropic' --exclude-dir=.git --exclude-dir=.github ."
