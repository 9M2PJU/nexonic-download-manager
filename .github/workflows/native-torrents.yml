name: Native torrents
on:
  pull_request:
    paths: ["native/**", "scripts/build-torrent-native.py", ".github/workflows/native-torrents.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
          - runner: windows-latest
            target: win-x64
          - runner: macos-15
            target: mac-current
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Native build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build pkg-config autoconf automake libtool
      - name: Native build tools (Mac)
        if: runner.os == 'macOS'
        run: brew install ninja pkgconf
      - uses: actions/cache@v4
        with:
          path: |
            .native-cache/installed
            .native-cache/binaries
            .native-cache/vcpkg/downloads
          key: native-${{ matrix.target }}-${{ hashFiles('native/vcpkg.json') }}
      - name: Build, real transfer and integrity tests
        run: python scripts/build-torrent-native.py ${{ matrix.target }} --test
      - uses: actions/upload-artifact@v7
        with:
          name: torrent-native-${{ matrix.target }}
          path: .native-cache/sdk/${{ matrix.target }}
